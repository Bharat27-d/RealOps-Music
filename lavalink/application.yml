server:
  port: 2333
  address: 0.0.0.0
  http2:
    enabled: true

lavalink:
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      repository: "https://maven.lavalink.dev/releases"
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.3"
      repository: "https://maven.lavalink.dev/releases"
    - dependency: "com.github.topi314.lavasearch:lavasearch-plugin:1.0.0"
      repository: "https://maven.lavalink.dev/releases"

  server:
    password: "youshallnotpass"
    sources:
      youtube: false # Handled via youtube-plugin
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false
    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: HIGH
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    gc-warnings: true

    ratelimit:
      ipBlocks: ["2a01:4f8:c2c:ca2e::/64"]
      excludedIps: ["2a01:4f8:c2c:ca2e::1"]
      strategy: "RotateOnBan"
      searchTriggersFail: true
      retryLimit: -1

plugins:
  youtube:
    enabled: true
    oauth:
      enabled: true
      refreshToken: "1//03a0hhMnQaHv4CgYIARAAGAMSSQF-L9Irs3sRoe9_EHBpV04RX9P18jnvka6_7PQJ7GXAd9IAIyuj0gB99CQckv5ddwl1maZJvB5YakfYKuXzHi5BvnqDzIOCABQ"
      skipInitialization: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      - ANDROID_VR
      - MUSIC
      - WEB
      - ANDROID_MUSIC

  lavasrc:
    providers:
      - "scsearch:%QUERY%"
      - "ytsearch:%QUERY%"
    sources:
      spotify: false
      applemusic: false
      deezer: false
      yandexmusic: false
      flowerytts: false
    spotify:
      clientId: "${SPOTIFY_CLIENT_ID:0e44915599bf4beda1c6b0aec49d3d04}"
      clientSecret: "${SPOTIFY_CLIENT_SECRET:05c92376e9524949a6db8b84a3a58c01}"
      countryCode: "US"
      playlistLoadLimit: 100
      albumLoadLimit: 50
    applemusic:
      countryCode: "US"
      mediaAPIToken: ""
      playlistLoadLimit: 100
      albumLoadLimit: 50
    deezer:
      masterDecryptionKey: ""

logging:
  file:
    path: ./logs/lavalink.log
  level:
    root: INFO
    lavalink: INFO
    dev.lavalink.youtube.http.YoutubeOauth2Handler: INFO
  request:
    enabled: true
    includeClientInfo: true
    includeHeaders: false
    includeQueryString: true
    includePayload: false
    maxPayloadLength: 10000

  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30

